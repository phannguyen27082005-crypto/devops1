services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nguyen_fashion_app:latest
    container_name: nguyen_fashion_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=nguyen-fashion-secret-key-2025
      # Kết nối đến SQL Server trên máy chủ Host (Thohihi\\SQLEXPRESS)
      - DB_SERVER=host.docker.internal
      - DB_PORT=1433
      - DB_NAME=nguyen_fashion
      - DB_USER=sa
      - DB_PASSWORD=123123
      - DB_ENCRYPT=true
      - DB_TRUST_SERVER_CERTIFICATE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./database:/app/database

